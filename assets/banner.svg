    <circle cx="1080" cy="200" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <circle r="1.6" fill="#ffffff">
      <animateMotion path="M -20,40 L 400,140" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.7;1" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.3" fill="#dff1ff">
      <animateMotion path="M 1220,80 L 780,230" dur="4.1s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.7;1" dur="4.1s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="url(#titleGrad)">
    Elevated sST2 After COVID-19
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="185" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#c9d9ff" opacity="0.85">
    Cardiovascular Comorbidities &#183; Analysis Transparency Repository
  </text>
</svg>
