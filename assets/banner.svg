<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="45%" stop-color="#0b1130"/>
      <stop offset="100%" stop-color="#1b1440"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fd3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8fd3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9fd8ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="url(#sky)"/>

  <circle cx="150" cy="60" r="70" fill="url(#glow)" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="220" r="90" fill="url(#glow)" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="80" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="40" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="120" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="55" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="150" r="1.1"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="30" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="90" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="45" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="170" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.7s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="60" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="110" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="35" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="140" r="1.1"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="70" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="180" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.9s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="50" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="100" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" begin="0.3s" repeatCount="indefinite"/></circle>
