    <circle cx="70" cy="200" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="230" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="220" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="250" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="210" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
